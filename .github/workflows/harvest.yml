name: Harvest check
# Run all the harvesters on the pull requests changing them, the weekly harvest itself runs on the server
# (scripts/weekly-update.sh). Also started by fix-harvest.yml on its fix branches
on:
  pull_request:
    paths:
      - "src/elixir_training_mcp/harvest/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/harvest.yml"
  workflow_dispatch:

jobs:
  harvest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: |
            **/uv.lock

      # Fails if a source fails or produces no triples
      - name: Harvest all sources
        run: uv run elixir-trainer-harvest

      - name: Upload harvested data as artifacts
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: harvested-training-data
          path: |
            data/*.ttl
            data/harvest-failures.json
          retention-days: 30
