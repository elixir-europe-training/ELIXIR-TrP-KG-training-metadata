<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Markdown rendering of the descriptions, sanitized since they come from external sources -->
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
    <style>
      /* Colors from the host style variables of the MCP Apps spec when it sends them, so the widget blends in the chat */
      :root {
        --fg: var(--color-text-primary, #1f2328);
        --muted: var(--color-text-secondary, #656d76);
        --bg: var(--color-background-primary, #ffffff);
        --panel: var(--color-background-secondary, #f6f8fa);
        --border: var(--color-border-primary, #d0d7de);
        --accent: #0b7a75;
        --accent-soft: rgba(11, 122, 117, 0.1);
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --fg: var(--color-text-primary, #e6edf3);
        --muted: var(--color-text-secondary, #8d96a0);
        --bg: var(--color-background-primary, #0d1117);
        --panel: var(--color-background-secondary, #161b22);
        --border: var(--color-border-primary, #30363d);
        --accent: #3fc1b8;
        --accent-soft: rgba(63, 193, 184, 0.14);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 14px 16px;
        font: 13px/1.45 var(--font-sans, system-ui, sans-serif);
        color: var(--fg);
        background: var(--bg);
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      .sub {
        color: var(--muted);
        margin: 2px 0 12px;
      }
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
        margin-bottom: 12px;
      }
      input,
      select,
      button {
        font: inherit;
        color: inherit;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 5px 9px;
      }
      input {
        flex: 1;
        min-width: 140px;
      }
      button {
        cursor: pointer;
      }
      .chip {
        border-radius: 999px;
        padding: 3px 10px;
      }
      .chip[aria-pressed="true"] {
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }
      /* Segmented control of the kind of trainings */
      .kinds {
        display: inline-flex;
      }
      .kinds button {
        border-radius: 0;
        margin-left: -1px;
      }
      .kinds button:first-child {
        border-radius: 8px 0 0 8px;
        margin-left: 0;
      }
      .kinds button:last-child {
        border-radius: 0 8px 8px 0;
      }
      .kinds button[aria-pressed="true"] {
        position: relative;
        background: var(--accent-soft);
        border-color: var(--accent);
        color: var(--accent);
      }
      .date svg {
        display: block;
        margin: 4px auto;
      }
      .list {
        max-height: 560px;
        overflow-y: auto;
        padding-right: 2px;
      }
      .month {
        position: sticky;
        top: 0;
        background: var(--bg);
        font-weight: 600;
        color: var(--muted);
        text-transform: uppercase;
        font-size: 11px;
        letter-spacing: 0.04em;
        padding: 8px 0 6px;
      }
      .card {
        display: grid;
        grid-template-columns: 52px minmax(0, 1fr);
        gap: 12px;
        padding: 10px;
        border: 1px solid var(--border);
        border-radius: 10px;
        margin-bottom: 8px;
        background: var(--panel);
      }
      .date {
        text-align: center;
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent);
        padding: 6px 0;
        align-self: start;
      }
      .date .day {
        font-size: 20px;
        font-weight: 700;
        line-height: 1.1;
      }
      .date .mon {
        font-size: 11px;
        text-transform: uppercase;
      }
      .title {
        font-weight: 600;
        font-size: 14px;
        color: var(--fg);
        text-decoration: none;
      }
      .title:hover {
        color: var(--accent);
        text-decoration: underline;
      }
      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        color: var(--muted);
        margin: 3px 0;
      }
      .mode {
        color: var(--accent);
        font-weight: 600;
      }
      /* Rendered markdown, collapsed to about 3 lines with a fade until expanded */
      .desc {
        margin: 4px 0 0;
        overflow-wrap: anywhere;
      }
      .desc.collapsed {
        max-height: 4.4em;
        overflow: hidden;
        mask-image: linear-gradient(to bottom, #000 55%, transparent);
      }
      .desc > :first-child {
        margin-top: 0;
      }
      .desc > :last-child {
        margin-bottom: 0;
      }
      .desc p,
      .desc ul,
      .desc ol {
        margin: 0 0 6px;
      }
      .desc ul,
      .desc ol {
        padding-left: 20px;
      }
      .desc :is(h1, h2, h3, h4, h5, h6) {
        font-size: 13px;
        margin: 8px 0 4px;
      }
      .desc a {
        color: var(--accent);
      }
      .desc img {
        display: none;
      }
      .desc code {
        font-size: 12px;
      }
      .more {
        border: none;
        background: none;
        padding: 0;
        color: var(--accent);
        font-size: 12px;
        margin-bottom: 4px;
      }
      .more:hover {
        text-decoration: underline;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
      }
      .tag {
        font-size: 11px;
        padding: 1px 7px;
        border-radius: 999px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .ask {
        margin-left: auto;
        font-size: 12px;
        padding: 2px 9px;
      }
      .empty {
        color: var(--muted);
        padding: 20px 0;
        text-align: center;
      }
      details {
        margin-top: 10px;
        color: var(--muted);
      }
      pre {
        white-space: pre-wrap;
        font-size: 11px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px;
      }
    </style>
  </head>
  <body>
    <h1 id="title">Trainings</h1>
    <div class="sub" id="sub">Loading...</div>
    <div class="toolbar">
      <span class="kinds" id="kinds"></span>
      <input id="filter" type="search" placeholder="Filter by title, topic, type or place" />
      <span id="modes"></span>
      <select id="country"></select>
      <select id="type"></select>
    </div>
    <div class="list" id="list"></div>
    <details>
      <summary>SPARQL query</summary>
      <pre id="query"></pre>
    </details>
    <script>
      // Minimal MCP App, speaking the MCP Apps JSON-RPC protocol over postMessage without the SDK
      let lastId = 0;
      const pending = {};
      const request = (method, params) =>
        new Promise((resolve, reject) => {
          const id = ++lastId;
          pending[id] = { resolve, reject };
          parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*");
        });
      const notify = (method, params) => parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
      const $ = (id) => document.getElementById(id);
      const esc = (s) =>
        String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

      let data = { trainings: [] };
      // kind: "all", "courses" or "learning_resources", mode and country filter courses, type filters learning resources
      const state = { kind: "all", mode: null, country: "", type: "" };
      const KINDS = { all: "All", courses: "Courses", learning_resources: "Learning resources" };
      const isCourse = (t) => t.kind === "course";
      // Book icon in the badge of learning resources, which have no date
      const BOOK = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"/><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"/></svg>`;

      // Theme and style variables of the host context
      const applyContext = (ctx = {}) => {
        if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
        for (const [name, value] of Object.entries(ctx.styles?.variables ?? {}))
          if (value) document.documentElement.style.setProperty(name, value);
      };

      // Sanitized HTML of a markdown text, links open in a new tab, plain text if the libraries did not load
      if (window.DOMPurify)
        DOMPurify.addHook("afterSanitizeAttributes", (node) => {
          if (node.tagName === "A") node.setAttribute("target", "_blank"), node.setAttribute("rel", "noopener");
        });
      const markdown = (text) =>
        window.marked && window.DOMPurify
          ? DOMPurify.sanitize(marked.parse(text, { breaks: true }))
          : `<p style="white-space: pre-line">${esc(text)}</p>`;

      // Dates are strings like "2026-05-27 09:00:00 UTC"
      const parseDate = (s) => (s ? new Date(s.slice(0, 10) + "T00:00:00") : null);
      const fmt = (d, opts) => d.toLocaleDateString(undefined, opts);

      const ofKind = (t, kind) => kind === "all" || (kind === "courses") === isCourse(t);

      // Trainings matching the text, mode, country and type filters, of all kinds
      const matching = () => {
        const text = $("filter").value.toLowerCase();
        return data.trainings.filter(
          (t) =>
            // Mode and country only filter courses, type only filters learning resources
            (isCourse(t)
              ? (!state.mode || t.mode === state.mode) && (!state.country || t.country === state.country)
              : !state.type || t.resourceType === state.type) &&
            (!text ||
              [t.name, t.description, t.locality, t.country, t.resourceType, ...t.keywords, ...t.organizations]
                .join(" ")
                .toLowerCase()
                .includes(text)),
        );
      };

      /** Kind buttons, with the number of trainings of each kind matching the other filters */
      function renderKinds(rows) {
        $("kinds").innerHTML = Object.entries(KINDS)
          .map(
            ([k, label]) =>
              `<button data-kind="${k}" aria-pressed="${state.kind === k}">${label} ${rows.filter((t) => ofKind(t, k)).length}</button>`,
          )
          .join("");
      }

      /** Mode chips, country and type selects, with the number of trainings of each value */
      function renderFilters() {
        const courses = data.trainings.filter(isCourse);
        const resources = data.trainings.filter((t) => !isCourse(t));
        const count = (rows, key) => {
          const c = {};
          for (const t of rows) if (t[key]) c[t[key]] = (c[t[key]] || 0) + 1;
          return Object.entries(c).sort((a, b) => b[1] - a[1]);
        };
        const select = (id, rows, key, all) => {
          const values = count(rows, key);
          $(id).style.display = values.length > 1 ? "" : "none";
          $(id).innerHTML =
            `<option value="">${all}</option>` + values.map(([v, n]) => `<option value="${esc(v)}">${esc(v)} (${n})</option>`).join("");
          $(id).value = state[id];
        };
        // Course filters hidden when only learning resources are shown, and the opposite
        const showCourses = state.kind !== "learning_resources" ? courses : [];
        $("modes").innerHTML = count(showCourses, "mode")
          .map(([m, n]) => `<button class="chip" data-mode="${esc(m)}" aria-pressed="${state.mode === m}">${esc(m)} ${n}</button>`)
          .join(" ");
        select("country", showCourses, "country", "All countries");
        select("type", state.kind !== "courses" ? resources : [], "resourceType", "All types");
      }

      /** Card of a course, with its dates, or of a learning resource, with its type and publication date */
      function card(t) {
        let badge, meta;
        if (isCourse(t)) {
          const start = parseDate(t.startDate);
          const end = parseDate(t.endDate);
          const range =
            end && end.getTime() !== start.getTime()
              ? `${fmt(start, { day: "numeric", month: "short" })} - ${fmt(end, { day: "numeric", month: "short", year: "numeric" })}`
              : fmt(start, { weekday: "short", day: "numeric", month: "short", year: "numeric" });
          const place = [t.locality, t.country].filter(Boolean).join(", ");
          badge = `<div class="day">${start.getDate()}</div><div class="mon">${fmt(start, { month: "short" })}</div>`;
          meta = `<span>${esc(range)}</span>
                ${t.mode ? `<span class="mode">${esc(t.mode)}</span>` : ""}
                ${place ? `<span>${esc(place)}</span>` : ""}`;
        } else {
          const published = parseDate(t.datePublished);
          badge = BOOK;
          meta = `${t.resourceType ? `<span class="mode">${esc(t.resourceType)}</span>` : ""}
                ${published && !isNaN(published) ? `<span>Published ${fmt(published, { month: "short", year: "numeric" })}</span>` : ""}`;
        }
        return `<div class="card">
            <div class="date">${badge}</div>
            <div>
              ${t.url ? `<a class="title" href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.name)}</a>` : `<span class="title">${esc(t.name)}</span>`}
              <div class="meta">${meta}</div>
              ${t.description ? `<div class="desc collapsed">${markdown(t.description)}</div><button class="more" hidden>Show more</button>` : ""}
              <div class="tags">
                ${t.organizations.map((o) => `<span class="tag" title="Organization">${esc(o)}</span>`).join("")}
                ${t.keywords.map((k) => `<span class="tag">#${esc(k)}</span>`).join("")}
                <button class="ask" data-index="${data.trainings.indexOf(t)}">Ask about it</button>
              </div>
            </div>
          </div>`;
      }

      /** Courses grouped by the month they start, then the learning resources */
      function renderList() {
        const matches = matching();
        renderKinds(matches);
        const rows = matches.filter((t) => ofKind(t, state.kind));
        if (!rows.length) {
          $("list").innerHTML = data.trainings.some((t) => ofKind(t, state.kind))
            ? `<div class="empty">No trainings match the filters</div>`
            : `<div class="empty">No ${state.kind === "all" ? "trainings" : KINDS[state.kind].toLowerCase()} found for organizations matching "${esc(data.organization)}"</div>`;
          return resize();
        }
        let html = "";
        let group = "";
        for (const t of rows) {
          const g = isCourse(t) ? fmt(parseDate(t.startDate), { month: "long", year: "numeric" }) : "Learning resources";
          if (g !== group) html += `<div class="month">${esc((group = g))}</div>`;
          html += card(t);
        }
        $("list").innerHTML = html;
        // "Show more" only for the descriptions cut by the collapsed height
        for (const desc of document.querySelectorAll(".desc.collapsed")) {
          const cut = desc.scrollHeight > desc.clientHeight + 2;
          desc.classList.toggle("collapsed", cut);
          desc.nextElementSibling.hidden = !cut;
        }
        resize();
      }

      function render() {
        const courses = data.trainings.filter(isCourse).length;
        $("title").textContent = `Trainings · ${data.organization}`;
        $("sub").textContent = `${courses} upcoming courses from ${data.fromDate} · ${data.trainings.length - courses} learning resources`;
        $("query").textContent = data.query;
        // Kind and filter text prefilled by the model, the user can change them
        if (data.kind in KINDS) state.kind = data.kind;
        if (data.filter) $("filter").value = data.filter;
        renderFilters();
        renderList();
      }

      // Height of the body content: the scrollHeight of the document never drops below the iframe height, so it would not shrink
      const resize = () => notify("ui/notifications/size-changed", { height: Math.ceil(document.body.getBoundingClientRect().height) });

      // Links are real anchors (right click, copy address), but a left click opens them through the host,
      // since the iframe sandbox can block navigation and popups
      document.addEventListener("click", (e) => {
        const link = e.target.closest("a[href]");
        if (link && !e.ctrlKey && !e.metaKey && !e.shiftKey) {
          e.preventDefault();
          request("ui/open-link", { url: link.href }).catch(() => window.open(link.href, "_blank", "noopener"));
        }
        const more = e.target.closest(".more");
        if (more) {
          const desc = more.previousElementSibling;
          more.textContent = desc.classList.toggle("collapsed") ? "Show more" : "Show less";
          resize();
        }
        const kind = e.target.closest("[data-kind]");
        if (kind) {
          state.kind = kind.dataset.kind;
          renderFilters();
          renderList();
        }
        const mode = e.target.closest("[data-mode]");
        if (mode) {
          state.mode = state.mode === mode.dataset.mode ? null : mode.dataset.mode;
          renderFilters();
          renderList();
        }
        const ask = e.target.closest(".ask");
        if (ask) {
          const t = data.trainings[+ask.dataset.index];
          const what = isCourse(t)
            ? `the course "${t.name}" starting on ${t.startDate.slice(0, 10)}`
            : `the learning resource "${t.name}"`;
          const text = `Tell me more about ${what} (${t.url}): who is it for, what does it teach, and what are the prerequisites?`;
          request("ui/message", { role: "user", content: [{ type: "text", text }] });
        }
      });
      $("filter").addEventListener("input", renderList);
      for (const id of ["country", "type"])
        $(id).addEventListener("change", (e) => {
          state[id] = e.target.value;
          renderList();
        });
      $("query").parentElement.addEventListener("toggle", resize);

      addEventListener("message", ({ data: m }) => {
        if (!m || m.jsonrpc !== "2.0") return;
        if (m.id !== undefined && pending[m.id]) {
          m.error ? pending[m.id].reject(m.error) : pending[m.id].resolve(m.result);
          delete pending[m.id];
        } else if (m.method === "ui/notifications/tool-input") {
          const args = m.params.arguments ?? {};
          $("title").textContent = `Trainings · ${args.organization ?? ""}`;
          if (args.filter_text) $("filter").value = args.filter_text;
          if (args.kind in KINDS) state.kind = args.kind;
        } else if (m.method === "ui/notifications/tool-result") {
          if (m.params.structuredContent) {
            data = m.params.structuredContent;
            render();
          } else {
            $("sub").textContent = m.params.content?.find((c) => c.type === "text")?.text ?? "No result";
            resize();
          }
        } else if (m.method === "ui/notifications/host-context-changed") {
          applyContext(m.params);
        }
      });

      request("ui/initialize", {
        protocolVersion: "2026-01-26",
        appInfo: { name: "Trainings", version: "0.1.0" },
        appCapabilities: {},
      }).then((r) => {
        applyContext(r.hostContext);
        notify("ui/notifications/initialized", {});
      });
    </script>
  </body>
</html>
