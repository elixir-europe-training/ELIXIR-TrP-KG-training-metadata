# Qlever SPARQL endpoint serving the harvested data/*.ttl files on http://localhost:7001 (or ${QLEVER_PORT})
# The index is rebuilt from data/*.ttl on every `docker compose up`
# scripts/weekly-update.sh harvests the sources and swaps in a new index every week, see README
services:
  # One-shot job: build the Qlever index from all Turtle files in data/
  # with a full-text index on all literals (-W) scored with BM25 (-S bm25)
  # Each file is loaded in its own named graph: ${GRAPH_BASE}<filename without .ttl>
  # The steps run are set by INDEX_STEPS (default "build swap"):
  # - build: build the new index in /index/next, the server can keep serving /index/live meanwhile
  # - swap: move /index/next to /index/live, keeping the current index in /index/prev (the server must be stopped)
  # - rollback: restore /index/prev to /index/live (the server must be stopped)
  index:
    image: adfreiburg/qlever:latest
    user: root # named volumes are owned by root
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        build() {
          rm -rf /index/next && mkdir /index/next
          args=(); for f in /input/*.ttl; do args+=(-f "$$f" -g "$${GRAPH_BASE}$$(basename "$$f" .ttl)"); done
          (cd /index/next && qlever-index -i training -F ttl -p false -W -S bm25 "$${args[@]}")
        }
        swap() {
          # Remove the files of the previous layout, where the index was directly in /index
          find /index -maxdepth 1 -type f -delete
          rm -rf /index/prev
          if [ -d /index/live ]; then mv /index/live /index/prev; fi
          mv /index/next /index/live
        }
        rollback() {
          rm -rf /index/live && mv /index/prev /index/live
        }
        for step in $${INDEX_STEPS:-build swap}; do echo "Index step: $$step"; $$step; done
        # The server writes logs next to the index files, and runs as the non-root qlever user
        chown -R qlever:qlever /index
    environment:
      GRAPH_BASE: ${GRAPH_BASE:-https://w3id.org/elixir-trainer/graph/}
    volumes:
      - ./data:/input:ro
      - index:/index

  # SPARQL endpoint with the text index loaded (-t), started once the index is built
  # SPARQL updates require the access token from .env, and are persisted on disk next to the index
  qlever:
    image: adfreiburg/qlever:latest
    entrypoint: ["qlever-server"]
    command:
      - "-i"
      - "/index/live/training"
      - "-p"
      - "7001"
      - "-t"
      - "-j"
      - "4"
      - "-m"
      - "2GB"
      - "-c"
      - "1GB"
      - "-a"
      - "${QLEVER_ACCESS_TOKEN:?Set QLEVER_ACCESS_TOKEN in .env}"
      - "--persist-updates"
    working_dir: /index/live
    ports:
      - "${QLEVER_PORT:-7001}:7001"
    volumes:
      - index:/index
    depends_on:
      index:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "--data-urlencode", "query=ASK {}", "http://localhost:7001"]
      interval: 5s
      retries: 60
    restart: unless-stopped

  # One-shot job: once the endpoint is up, compute VoID statistics with docs/generate-void.ru
  # and store them in the ${GRAPH_BASE}void named graph,
  # then load docs/sparql-examples.ttl in the ${GRAPH_BASE}sparql-examples named graph
  generate-metadata:
    image: adfreiburg/qlever:latest
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -e
        # Authenticated request to the endpoint, the verbose JSON response is only printed on failure
        qlever-request() {
          curl -sS --fail-with-body -o /tmp/response.json -H "Authorization: Bearer $${QLEVER_ACCESS_TOKEN}" "$$@" \
            || { cat /tmp/response.json; exit 1; }
        }
        # Remove the examples first, so they are not counted in the VoID statistics when re-running
        qlever-request http://qlever:7001 -H "Content-Type: application/sparql-update" \
          --data-binary "DROP SILENT GRAPH <$${GRAPH_BASE}sparql-examples>"
        sed "s|__VOID_GRAPH__|$${GRAPH_BASE}void|g" /generate-void.ru > /tmp/generate-void.ru
        qlever-request http://qlever:7001 -H "Content-Type: application/sparql-update" --data-binary @/tmp/generate-void.ru
        echo "VoID statistics stored in graph $${GRAPH_BASE}void"
        # Graph Store Protocol PUT replaces the content of the graph
        qlever-request -X PUT "http://qlever:7001/?graph=$${GRAPH_BASE}sparql-examples" \
          -H "Content-Type: text/turtle" --data-binary @/sparql-examples.ttl
        echo "SPARQL examples stored in graph $${GRAPH_BASE}sparql-examples"
    environment:
      GRAPH_BASE: ${GRAPH_BASE:-https://w3id.org/elixir-trainer/graph/}
      QLEVER_ACCESS_TOKEN: ${QLEVER_ACCESS_TOKEN:?Set QLEVER_ACCESS_TOKEN in .env}
    volumes:
      - ./docs/generate-void.ru:/generate-void.ru:ro
      - ./docs/sparql-examples.ttl:/sparql-examples.ttl:ro
    depends_on:
      qlever:
        condition: service_healthy

  # MCP server on /mcp, agent on /chat and chat UI on /, started once the examples and VoID are loaded (it indexes them
  # at startup). The API key of the agent and the public hostnames (ALLOWED_HOSTS) are read from .env
  api:
    build: .
    env_file: .env
    environment:
      SPARQL_ENDPOINT_URL: http://qlever:7001
      GRAPH_BASE: ${GRAPH_BASE:-https://w3id.org/elixir-trainer/graph/}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      # Embedding model (1.1 GB) downloaded on the first start only
      - fastembed-cache:/cache/fastembed
    depends_on:
      generate-metadata:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      # The first start downloads the embedding model
      start_period: 20m
    restart: unless-stopped

  # One-shot job, only run by scripts/weekly-update.sh: harvest the sources in data/, see harvest/run.py
  harvest:
    build: .
    profiles: [jobs]
    command: ["elixir-trainer-harvest"]
    volumes:
      - ./data:/app/data

volumes:
  index:
  fastembed-cache:
